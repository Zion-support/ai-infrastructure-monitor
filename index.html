<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Infrastructure Monitor</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📡 AI Infrastructure Monitor</h1><p>Simulate anomaly scoring for a metric stream.</p><label>CPU avg (%): <input id="c" type="number" value="45"></label> <label>CPU current (%): <input id="n" type="number" value="92"></label> <label>Std dev: <input id="s" type="number" value="8"></label> <button onclick="go()">Detect</button><div id="out"></div><script>function go(){const a=+document.getElementById('c').value,n=+document.getElementById('n').value,s=+document.getElementById('s').value||1;const z=((n-a)/s).toFixed(1);document.getElementById('out').textContent=`Z-score: ${z}\n${z>3?'🔴 ANOMALY — AI correlates with recent deploy; suggested action: rollback or scale out':z>2?'🟡 Watch — within tolerance band but trending up':'🟢 Normal behavior'}\n\nFull-stack AI monitoring deployment: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-infrastructure-monitor">GitHub</a> · <a href="https://ziontechgroup.com/site-uptime-watchdog/">Uptime Watchdog</a></p></body></html>
